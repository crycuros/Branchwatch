<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg-panel { fill: #09090b; stroke: #27272a; stroke-width: 1; }
      .node-card { fill: #141416; stroke: #27272a; stroke-width: 1.25; rx: 12; }
      .node-card-active { fill: #18181b; stroke: #52525b; stroke-width: 1.5; rx: 12; }
      .title-text { fill: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
      .cmd-text { fill: #71717a; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .badge-box { fill: #1c1c1f; stroke: #3f3f46; stroke-width: 1; rx: 5; }
      .badge-text { fill: #a1a1aa; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; }
      .tag-box { fill: #18181b; stroke: #27272a; stroke-width: 1; rx: 4; }
      .tag-text { fill: #71717a; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; }
      .active-tag-box { fill: #27272a; stroke: #52525b; stroke-width: 1; rx: 4; }
      .active-tag-text { fill: #e4e4e7; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 500; }
    </style>
    
    <marker id="arrowhead-silver" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6.5 4 L 0 6.5 z" fill="#71717a" />
    </marker>
    <marker id="arrowhead-white" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6.5 4 L 0 6.5 z" fill="#d4d4d8" />
    </marker>
  </defs>

  <!-- Background Base Canvas (Deep Zinc/Black) -->
  <rect width="920" height="320" class="bg-panel" rx="16" />
  
  <!-- Subtle Grid Dots (Monochrome) -->
  <g opacity="0.12">
    <circle cx="40" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="100" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="160" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="220" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="280" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="340" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="400" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="460" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="520" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="580" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="640" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="700" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="760" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="820" cy="40" r="1" fill="#a1a1aa"/>
    <circle cx="880" cy="40" r="1" fill="#a1a1aa"/>
    
    <circle cx="40" cy="160" r="1" fill="#a1a1aa"/>
    <circle cx="100" cy="160" r="1" fill="#a1a1aa"/>
    <circle cx="820" cy="160" r="1" fill="#a1a1aa"/>
    <circle cx="880" cy="160" r="1" fill="#a1a1aa"/>
    
    <circle cx="40" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="100" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="160" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="220" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="280" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="340" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="400" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="460" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="520" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="580" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="640" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="700" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="760" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="820" cy="280" r="1" fill="#a1a1aa"/>
    <circle cx="880" cy="280" r="1" fill="#a1a1aa"/>
  </g>

  <!-- Connectors / Wires (Monochrome Zinc) -->
  <!-- 1 -> 2 -->
  <path d="M 180 160 L 250 160" stroke="#52525b" stroke-width="1.75" marker-end="url(#arrowhead-silver)" />
  <!-- 2 -> 3 -->
  <path d="M 400 160 L 470 160" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrowhead-silver)" />
  <!-- 3 -> 4 (Branch Top) -->
  <path d="M 620 160 C 655 160, 655 85, 690 85" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrowhead-silver)" />
  <!-- 4 -> 5 (Push from Branch) -->
  <path d="M 840 85 L 850 85" stroke="#52525b" stroke-width="1.75" />
  <!-- 3 -> 5 (Push Bottom) -->
  <path d="M 620 160 C 655 160, 655 235, 690 235" stroke="#52525b" stroke-width="1.75" marker-end="url(#arrowhead-silver)" />

  <!-- Wire Data Labels (Monochrome Gray Badges) -->
  <g transform="translate(185, 142)">
    <rect width="56" height="17" class="badge-box" />
    <text x="28" y="12" text-anchor="middle" class="badge-text">changes</text>
  </g>
  <g transform="translate(408, 142)">
    <rect width="52" height="17" class="badge-box" />
    <text x="26" y="12" text-anchor="middle" class="badge-text">staged</text>
  </g>
  <g transform="translate(628, 102)">
    <rect width="56" height="17" class="badge-box" />
    <text x="28" y="12" text-anchor="middle" class="badge-text">commit</text>
  </g>
  <g transform="translate(628, 202)">
    <rect width="56" height="17" class="badge-box" />
    <text x="28" y="12" text-anchor="middle" class="badge-text">remote</text>
  </g>

  <!-- NODE 1: Working Tree -->
  <g transform="translate(30, 115)">
    <rect width="150" height="90" class="node-card" />
    <circle cx="150" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#27272a" />
    <path d="M 18 20 L 23 20 M 23 20 L 26 23 L 30 23 M 18 20 L 18 28 L 30 28 L 30 23" stroke="#d4d4d8" stroke-width="1.3" stroke-linejoin="round" fill="none" />
    <text x="44" y="29" class="title-text">Working Tree</text>
    <text x="14" y="56" class="cmd-text">git status</text>
    <rect x="14" y="66" width="68" height="14" class="tag-box" />
    <text x="20" y="76.5" class="tag-text">uncommitted</text>
  </g>

  <!-- NODE 2: Stage -->
  <g transform="translate(250, 115)">
    <rect width="150" height="90" class="node-card" />
    <circle cx="0" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <circle cx="150" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#27272a" />
    <path d="M 19 19 L 29 19 L 29 29 L 19 29 Z M 22 23 L 26 23 M 22 26 L 25 26" stroke="#d4d4d8" stroke-width="1.3" fill="none" />
    <text x="44" y="29" class="title-text">Stage</text>
    <text x="14" y="56" class="cmd-text">git add .</text>
    <rect x="14" y="66" width="76" height="14" class="tag-box" />
    <text x="20" y="76.5" class="tag-text">index staged</text>
  </g>

  <!-- NODE 3: Commit -->
  <g transform="translate(470, 115)">
    <rect width="150" height="90" class="node-card-active" />
    <circle cx="0" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <circle cx="150" cy="45" r="4.5" fill="#d4d4d8" stroke="#09090b" stroke-width="2" />
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#27272a" />
    <circle cx="24" cy="24" r="3.5" stroke="#f4f4f5" stroke-width="1.3" fill="none" />
    <path d="M 16 24 L 20.5 24 M 27.5 24 L 32 24" stroke="#f4f4f5" stroke-width="1.3" />
    <text x="44" y="29" class="title-text">Commit</text>
    <text x="14" y="56" class="cmd-text">git commit -m</text>
    <rect x="14" y="66" width="72" height="14" class="active-tag-box" />
    <text x="20" y="76.5" class="active-tag-text">SHA: a26a0b6</text>
  </g>

  <!-- NODE 4: Branch (Top) -->
  <g transform="translate(690, 40)">
    <rect width="150" height="90" class="node-card" />
    <circle cx="0" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <circle cx="150" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#27272a" />
    <path d="M 19 19 L 19 29 M 19 24 C 19 21, 25 21, 27 21 L 29 21" stroke="#d4d4d8" stroke-width="1.3" fill="none" />
    <circle cx="29" cy="21" r="2" fill="#d4d4d8" />
    <text x="44" y="29" class="title-text">Branch</text>
    <text x="14" y="56" class="cmd-text">git switch main</text>
    <rect x="14" y="66" width="82" height="14" class="tag-box" />
    <text x="20" y="76.5" class="tag-text">ref: refs/heads</text>
  </g>

  <!-- NODE 5: Push (Bottom) -->
  <g transform="translate(690, 190)">
    <rect width="150" height="90" class="node-card" />
    <circle cx="0" cy="45" r="4.5" fill="#71717a" stroke="#09090b" stroke-width="2" />
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#27272a" />
    <path d="M 24 28 L 24 19 M 20 23 L 24 19 L 28 23" stroke="#d4d4d8" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <text x="44" y="29" class="title-text">Push</text>
    <text x="14" y="56" class="cmd-text">git push origin</text>
    <rect x="14" y="66" width="84" height="14" class="tag-box" />
    <text x="20" y="76.5" class="tag-text">upstream sync</text>
  </g>
</svg>
